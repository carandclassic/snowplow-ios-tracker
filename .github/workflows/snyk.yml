
name: Snyk

on:
  push:
    branches: [ master ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Snyk monitor
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      with:
        submodules: true
        persist-credentials: false

    - name: Run Snyk to check for vulnerabilities in tracker
      uses: snyk/actions/cocoapods@11b673cfb4b0dc0d860a1323caa199d54950dcce # master # zizmor: ignore[stale-action-refs] upstream tracks master; pinned to its current commit
      with:
        command: monitor
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # zizmor: ignore[secrets-outside-env] repo-level secret, no deployment environment
        COMMAND: cd Examples/demo/SnowplowSwiftCocoapodsDemo
